<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800"><rect width="1500" height="800" fill="#f7f6f1"/><style>.t{font:700 32px Arial;fill:#20242a}.b{fill:#fff;stroke:#c9c5ba;stroke-width:2;rx:16}.x{font:600 19px Arial;fill:#20242a}.s{font:16px Arial;fill:#626a72}.a{stroke:#a06b0b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4z" fill="#a06b0b"/></marker></defs><text x="60" y="65" class="t">Practical flow 3 · Add a new company to training</text><text x="60" y="100" class="s">A researcher adds a new report to an existing industry/year cohort.</text><rect x="70" y="180" width="230" height="120" class="b"/><text x="185" y="225" text-anchor="middle" class="x">New report</text><text x="185" y="260" text-anchor="middle" class="s">Same industry/year</text><rect x="350" y="180" width="230" height="120" class="b"/><text x="465" y="225" text-anchor="middle" class="x">Chunk + embed</text><text x="465" y="260" text-anchor="middle" class="s">PostgreSQL + Qdrant</text><rect x="630" y="180" width="230" height="120" class="b"/><text x="745" y="225" text-anchor="middle" class="x">Discover themes</text><text x="745" y="260" text-anchor="middle" class="s">Common recurring evidence</text><rect x="910" y="180" width="230" height="120" class="b"/><text x="1025" y="225" text-anchor="middle" class="x">Review questions</text><text x="1025" y="260" text-anchor="middle" class="s">Max 10 per TOE</text><rect x="1190" y="180" width="240" height="120" class="b"/><text x="1310" y="225" text-anchor="middle" class="x">Create new version</text><text x="1310" y="260" text-anchor="middle" class="s">v1 → v2</text><path d="M305 240h40M585 240h40M865 240h40M1145 240h40" class="a"/><rect x="230" y="500" width="1040" height="140" class="b"/><text x="750" y="545" text-anchor="middle" class="x">Automatic recalculation</text><text x="750" y="580" text-anchor="middle" class="s">All company feature rows · regression scores · industry averages · rankings · client dashboard</text><text x="750" y="610" text-anchor="middle" class="s">Previous versions remain immutable and auditable.</text></svg>
