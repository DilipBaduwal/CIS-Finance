<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700"><rect width="1500" height="700" fill="#f7f6f1"/><style>.t{font:700 32px Arial;fill:#20242a}.b{fill:#fff;stroke:#c9c5ba;stroke-width:2;rx:16}.x{font:600 20px Arial;fill:#20242a}.s{font:16px Arial;fill:#626a72}.a{stroke:#32648f;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4z" fill="#32648f"/></marker></defs><text x="60" y="65" class="t">Practical flow 1 · View an industry benchmark</text><text x="60" y="100" class="s">A client wants to understand AI readiness in the IT industry.</text><rect x="70" y="190" width="250" height="130" class="b"/><text x="195" y="235" text-anchor="middle" class="x">1. Choose industry</text><text x="195" y="270" text-anchor="middle" class="s">Information Technology</text><text x="195" y="295" text-anchor="middle" class="s">Fiscal year: 2025–26</text><rect x="430" y="190" width="250" height="130" class="b"/><text x="555" y="235" text-anchor="middle" class="x">2. Open dashboard</text><text x="555" y="270" text-anchor="middle" class="s">Cumulative score</text><text x="555" y="295" text-anchor="middle" class="s">TOE dimension averages</text><rect x="790" y="190" width="250" height="130" class="b"/><text x="915" y="235" text-anchor="middle" class="x">3. Select question</text><text x="915" y="270" text-anchor="middle" class="s">Example: AI-ready</text><text x="915" y="295" text-anchor="middle" class="s">technology capability</text><rect x="1150" y="190" width="280" height="130" class="b"/><text x="1290" y="235" text-anchor="middle" class="x">4. Compare companies</text><text x="1290" y="270" text-anchor="middle" class="s">TCS · Infosys</text><text x="1290" y="295" text-anchor="middle" class="s">Wipro · HCLTech</text><path d="M325 255h95M685 255h95M1045 255h95" class="a"/><text x="750" y="470" text-anchor="middle" class="x">Result: industry-level and question-level comparison</text><text x="750" y="510" text-anchor="middle" class="s">Every score can be traced to the company’s report chunks and page evidence.</text></svg>
